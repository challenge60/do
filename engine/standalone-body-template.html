<body>

<div class="app-shell">
<header class="top compact">
  <div class="wrap">
    <div class="brand" style="display: none;"><span class="mark">My도전</span><span class="sub">{{MARK}} {{SHORT_SUB}}</span><span class="ver" id="appVerBadge">Ver. 2026.08.23_16.43</span></div>
    <div class="meta-row" id="metaRow" style="display: none;">
      <div class="meta-line" id="headerMeta" style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
        <span id="headerMetaLeft">Ver. 2026.08.23_16.43</span>
        <span id="headerMetaRight">{{YEAR_RANGE}} ({{COUNT}}문항)</span>
      </div>
      <button type="button" class="install-btn" id="installBtn">📲 앱 설치</button>
    </div>
    <div class="page-bar" id="pageBar" style="display: flex;">
    <button class="back-arrow" id="pageBarBack">←</button>
    <h2>설정 · 데이터 관리</h2>
    
  </div>
  </div>
</header>

<div class="wrap" id="app">
    <div class="app-loading-placeholder" style="text-align:center;padding:60px 20px;color:var(--muted);">
      <div style="font-size:1.8rem;">📖</div>
      <p style="margin-top:10px;font-size:0.85rem;">불러오는 중...</p>
    </div>
  </div>

<div class="study-navbar" id="studyNavBar" style="display: none;">
  <div class="wrap">
    <div class="btn-row" style="margin-top:0;">
      <button class="btn ghost" id="studyNavPrev">← 이전</button>
      <button class="btn danger" id="studyNavWrong">오답 X</button>
      <button class="btn primary" id="studyNavReveal">정답보기</button>
      <button class="btn success" id="studyNavCorrect">정답 O</button>
      <button class="btn ghost" id="studyNavNext">다음 →</button>
    </div>
  </div>
</div>

<nav class="bottom">
  <div class="nav-inner">
  <button data-view="home" class=""><span class="ic">🏠</span><span class="lb">홈</span></button>
  <button data-view="exam" class=""><span class="ic">📝</span><span class="lb">모의고사</span></button>
  <button data-view="unit" class=""><span class="ic">📚</span><span class="lb">단원별</span></button>
  <button data-view="year" class=""><span class="ic">📅</span><span class="lb">연도별</span></button>
  <button data-view="freq" class=""><span class="ic">🔥</span><span class="lb">빈도별</span></button>
  <button data-view="wrong"><span class="ic">🔁</span><span class="lb">오답노트</span></button>
  <button data-view="bookmark"><span class="ic">⭐</span><span class="lb">즐겨찾기</span></button>
  <button data-view="about"><span class="ic">💬</span><span class="lb">오픈톡</span></button>
  </div>
</nav>
</div>

<div id="toast" class="toast"></div>
